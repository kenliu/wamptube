name: Build

# Builds the macOS and Windows apps on every merge (push) to main and publishes
# them together as the rolling "latest" release. Also runnable by hand from the
# Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to create the release

concurrency:
  group: build-main
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon
            name: wamptube-macos-arm64
          - os: windows-latest
            name: wamptube-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: deno install

      - name: Rust tests (offline)
        working-directory: src-tauri
        run: cargo test

      # beforeBuildCommand in tauri.conf.json runs `deno task build` (tsc + vite).
      - name: Build app
        run: deno task tauri build

      - name: Collect artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/dmg/*.dmg out/
          # A zipped .app for installing without mounting the dmg.
          ditto -c -k --keepParent src-tauri/target/release/bundle/macos/wamptube.app out/wamptube-macos-arm64.zip

      - name: Collect artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi out/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
          retention-days: 30

  release:
    needs: build
    # Publish whatever built: a broken Windows build must not hold back the
    # macOS release (and the other way round). The build job still shows red.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=(out/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No build produced artifacts; leaving the old release in place." >&2
            exit 1
          fi
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest "${files[@]}" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest build (${GITHUB_SHA::7})" \
            --notes "Unsigned builds of ${GITHUB_SHA}. Both need yt-dlp and deno installed. macOS (Apple Silicon): brew install yt-dlp deno; first launch: right-click > Open, or run: xattr -dr com.apple.quarantine /Applications/wamptube.app. Windows (x64): winget install yt-dlp.yt-dlp DenoLand.Deno (or scoop install yt-dlp deno); SmartScreen will warn on first run: More info > Run anyway."
